<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Exercícios</title>

    <style>
        :root {
            --azul: #007bff;
            --azul-escuro: #003366;
            --azul-hover: #0056b3;
            --bg: #ffffff;
            --card: #f5f9ff;
            --texto: #003366;
            --borda: #007bff;
            --verde: #22c55e;
            --vermelho: #e63946;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }

        body {
            background: var(--bg);
            padding: 35px;
            color: var(--texto);
            display: flex;
            justify-content: center;
        }

        .card {
            width: 420px;
            background: var(--card);
            padding: 32px;
            border-radius: 18px;
            border: 2px solid var(--borda);
            color: var(--texto);
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.25);
            animation: fade .3s ease;
        }

        @keyframes fade {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h2, h3 {
            margin-bottom: 15px;
            color: var(--azul-escuro);
            font-weight: 700;
        }

        label { font-weight: 600; margin-top: 16px; display: block; color: var(--azul-escuro); }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 10px;
            border: 2px solid var(--borda);
            background: #ffffff;
            color: var(--texto);
            font-size: 15px;
            outline: none;
            transition: .2s;
        }

        input:focus, select:focus { border-color: var(--azul-hover); }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 10px;
            background: var(--azul);
            color: white;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: .25s;
        }

        button:hover { background: var(--azul-hover); }

        .hidden { display: none; }

        #perguntaBox {
            font-size: 19px;
            margin-bottom: 18px;
            font-weight: 700;
            color: var(--azul-escuro);
            padding: 14px;
            border-radius: 12px;
            transition: .25s;
        }

        @keyframes certoAnim {
            0%   { background: var(--card); border-color: var(--borda); }
            40%  { background: #d1ffd9; border-color: var(--verde); transform: scale(1.03); }
            100% { background: var(--card); border-color: var(--borda); transform: scale(1); }
        }

        .anim-acerto { animation: certoAnim 0.6s ease; }

        @keyframes erroAnim {
            0% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        .anim-erro {
            animation: erroAnim 0.4s ease;
            border: 2px solid var(--vermelho) !important;
            background: #ffe5e7 !important;
        }

        #gabaritoBox {
            background: var(--card);
            border: 3px solid var(--borda);
            border-radius: 18px;
            padding: 26px;
            box-shadow: 0 0 18px rgba(0, 123, 255, 0.25);
            margin-top: 60px;
        }

        .g-item {
            padding: 12px;
            margin-bottom: 14px;
            background: #ffffff;
            border-radius: 12px;
            border-left: 6px solid var(--azul);
        }

        .ok { color: var(--verde); font-weight: bold; }


        .btn-voltar {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--azul);
            padding: 10px 22px;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: .25s;
        }

        .btn-voltar:hover { background: var(--azul-hover); }

        #btnConcluir {
            margin-top: 25px;
        }
    </style>
</head>

<body>

<a class="btn-voltar" href="tela.inicial.html">Voltar</a>

<div class="card" id="inicio">
    <h2>Gerador de Exercícios</h2>

    <label>Escolha a matéria:</label>
    <select id="materia">
        <option value="matematica">Matemática</option>
        <option value="portugues">Português</option>
    </select>

    <label>Dificuldade:</label>
    <select id="dificuldade">
        <option value="facil">Fácil</option>
        <option value="medio">Médio</option>
        <option value="dificil">Difícil</option>
    </select>

    <label>Quantidade de questões:</label>
    <input id="quantidade" type="number" min="1" max="20" value="5">

    <button onclick="iniciar()">Iniciar</button>
</div>

<div class="card hidden" id="quiz">
    <div id="perguntaBox"></div>

    <label>Sua resposta:</label>
    <input id="respostaUser">

    <button onclick="enviarResposta()">Responder</button>
</div>

<div class="card hidden" id="gabaritoBox"></div>
<button id="btnConcluir" class="hidden" onclick="reiniciar()">Concluir</button>

<script>
let lista = [];
let respostasUsuario = [];
let atual = 0;
let total = 0;

async function iniciar() {
    const materia = document.getElementById("materia").value;
    const dificuldade = document.getElementById("dificuldade").value;
    total = Number(document.getElementById("quantidade").value);

    lista = [];
    respostasUsuario = [];
    atual = 0;

    for (let i = 0; i < total; i++) {
        const resp = await fetch("http://127.0.0.1:5000/gerar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ materia, dificuldade })
        });

        lista.push(await resp.json());
    }

    document.getElementById("inicio").classList.add("hidden");
    document.getElementById("quiz").classList.remove("hidden");

    mostrarPergunta();
}

function mostrarPergunta() {
    const box = document.getElementById("perguntaBox");
    box.innerText = `(${atual+1}/${total}) • ${lista[atual].pergunta}`;
    box.classList.remove("anim-acerto", "anim-erro");

    document.getElementById("respostaUser").value = "";
}

function enviarResposta() {
    const r = document.getElementById("respostaUser").value.trim();
    const certa = lista[atual].resposta.trim().toLowerCase();
    respostasUsuario.push(r);

    const box = document.getElementById("perguntaBox");

    if (r.toLowerCase() === certa) {
        box.classList.remove("anim-erro");
        box.classList.add("anim-acerto");
    } else {
        box.classList.remove("anim-acerto");
        box.classList.add("anim-erro");
    }

    setTimeout(() => {
        atual++;
        if (atual >= total) {
            mostrarGabarito();
        } else {
            mostrarPergunta();
        }
    }, 500);
}

function mostrarGabarito() {
    document.getElementById("quiz").classList.add("hidden");

    let html = "<h3>Gabarito Final:</h3>";

    lista.forEach((q, i) => {
        html += `
            <div class="g-item">
                <b>${i+1}. ${q.pergunta}</b><br>
                <b>Sua resposta:</b> ${respostasUsuario[i]}<br>
                <b>Correta:</b> <span class="ok">${q.resposta}</span>
            </div>
        `;
    });

    const gab = document.getElementById("gabaritoBox");
    gab.innerHTML = html;
    gab.classList.remove("hidden");

    document.getElementById("btnConcluir").classList.remove("hidden");
}

function reiniciar() {
    document.getElementById("gabaritoBox").classList.add("hidden");
    document.getElementById("btnConcluir").classList.add("hidden");

    lista = [];
    respostasUsuario = [];
    atual = 0;
    total = 0;

    document.getElementById("inicio").classList.remove("hidden");
}
</script>

</body>
</html>
